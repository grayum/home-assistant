name: Validate ESPHome

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned ESPHome
        run: python -m pip install -r requirements-dev.txt
      - name: Validate YAML and generate C++ with temporary dummy secrets
        run: python scripts/validate-esphome.py --generate
