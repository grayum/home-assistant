# Eurom Mon Soleil DSP 400 WiFi - ESPHome via Tuya MCU protocol
# Tuya product id: wv9d5ocs76u6maqj
#
# Maintainer-reported datapoints (logs + button tests, 2026-10-28).
# Experimental; see DATAPOINTS.md and TESTING.md for evidence limits.
# Datapoints:
#   DP1   switch   -> power on/off                                  REPORTED
#   DP2   int      -> target temperature (0-37 °C; ECO sets 16)     REPORTED
#   DP3   int      -> room temperature                              REPORTED
#   DP4   enum     -> MODE button: 0 = M (manual), 1 = P (program)  REPORTED
#   DP101 enum     -> heating element: 0 = heating (sun), 3 = off   REPORTED
#                     (bars button toggles it in M-mode; in P-mode the thermostat sets it)
#   DP102 switch   -> ECO mode (16 °C, display "EC")                REPORTED
#   DP12  bitmask  -> fault code (0 = no fault)
# Open-window detection: no datapoint change observed in maintainer tests.

esphome:
  name: eurom-400-wifi
  min_version: 2026.9.0
  friendly_name: Eurom 400

esp8266:
  board: esp01_1m

logger:
  baud_rate: 0   # hardware UART0 is used for the heater MCU; logs arrive over WiFi

ota:
  - platform: esphome
    encryption:  # Inherits the API key; see README for older-firmware migration.

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Eurom 400 WiFi Fallback Hotspot
    password: "ThisIsNotMyPassword"

captive_portal:

api:
  encryption:
    key: !secret eurom_400_wifi__encryption_key

uart:
  rx_pin: GPIO13
  tx_pin: GPIO15
  baud_rate: 9600
  id: uart_bus

time:
  - platform: homeassistant
    id: ha_time

tuya:
  time_id: ha_time

# Climate Heat/Off does not select M/P mode. Use P for thermostat regulation.
# Selecting Heat can also WRITE DP101=0; see README.md and TESTING.md.
# Thermostat card: on/off, setpoint, room temperature and heating/idle status
climate:
  - platform: tuya
    name: "Eurom heater"
    switch_datapoint: 1
    target_temperature_datapoint: 2
    current_temperature_datapoint: 3
    supports_heat: true
    active_state:
      datapoint: 101
      heating_value: 0
    visual:
      min_temperature: 0
      max_temperature: 37
      temperature_step: 1

select:
  # MODE button: M = manual (heating on/off with bars button), P = thermostat / week timer
  - platform: tuya
    name: "Eurom mode"
    enum_datapoint: 4
    options:
      0: "Manual (M)"
      1: "Thermostat (P)"

  # Heating element (sun icon). Observed manual control in M-mode.
  # This select is writable in HA even in P-mode; effects require testing.
  - platform: tuya
    name: "Eurom heating element"
    enum_datapoint: 101
    options:
      0: "On"
      3: "Off"

switch:
  - platform: tuya
    name: "Eurom ECO (16 °C)"
    switch_datapoint: 102
    icon: "mdi:leaf"

sensor:
  - platform: tuya
    name: "Eurom room temperature"
    sensor_datapoint: 3
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  - platform: tuya
    name: "Eurom fault code"
    sensor_datapoint: 12
    accuracy_decimals: 0
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: ESP IP Address
    ssid:
      name: ESP Connected SSID
    bssid:
      name: ESP Connected BSSID
    mac_address:
      name: ESP Mac Wifi Address